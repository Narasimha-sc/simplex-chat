name: linux-core
run-name: "${{ github.event_name == 'workflow_dispatch' && format('linux-core {0} {1}@{2}', inputs.nonce, inputs.repo, inputs.sha) || 'linux-core: registered by a push to its branch, nothing built' }}"

# Builds the Linux x86_64 desktop core library (libsimplex.so and the GHC libs it needs, -O2, GHC 9.6.3, Ubuntu 22.04 like
# build.yml's release job) of one commit and uploads it as one zstd tarball. ~/build/linux.sh builds the app around it.
# The build steps of the commit built run as they are in that commit; this workflow only supplies the runner setup, the
# caches and the artifact. The push trigger only makes GitHub list the workflow.
on:
  push:
    branches: [ci/builds]
    paths: [.github/workflows/linux-core.yml]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build
        required: true
        type: string
      repo:
        description: Repository holding the commit
        type: choice
        default: Narasimha-sc/simplex-chat
        options: [Narasimha-sc/simplex-chat, simplex-chat/simplex-chat]
      nonce:
        description: Identifies the run to the script that started it
        required: true
        type: string
      tree:
        description: Expected git tree id of the commit (the run fails if it differs); empty to skip the check
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-core-${{ inputs.nonce || github.sha }}

jobs:
  core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: chat
    steps:
      - name: Check inputs
        working-directory: .
        env:
          SHA: ${{ inputs.sha }}
          NONCE: ${{ inputs.nonce }}
          TREE: ${{ inputs.tree }}
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA"; exit 1; }
          [[ $NONCE =~ ^[0-9a-f]{12}$ ]] || { echo "::error::nonce must be 12 hex digits"; exit 1; }
          [[ -z $TREE || $TREE =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tree must be a full tree id"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          path: chat
          submodules: recursive
          persist-credentials: false

      - name: Check tree
        env:
          SHA: ${{ inputs.sha }}
          TREE: ${{ inputs.tree }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          [[ -z $TREE || "$(git rev-parse 'HEAD^{tree}')" == "$TREE" ]] || { echo "::error::the commit's tree is $(git rev-parse 'HEAD^{tree}'), not $TREE"; exit 1; }

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /

      - name: Restore core library
        id: core-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            chat/apps/multiplatform/common/src/commonMain/cpp/desktop/libs/linux-x86_64
            chat/apps/multiplatform/build/links
          key: linux-core-lib-${{ hashFiles('chat/src/**', 'chat/cabal.project', 'chat/simplex-chat.cabal', 'chat/PRIVACY.md', 'chat/scripts/desktop/build-lib-linux.sh') }}

      - name: Setup Haskell
        id: haskell
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: 9.6.3
          cabal-version: 3.10.2.0

      # each run starts from the newest store and saves its own, so dist-newstyle never goes stale
      - name: Restore cabal store
        id: cabal-cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            chat/dist-newstyle
          key: linux-core-store-ghc9.6.3-${{ hashFiles('chat/cabal.project', 'chat/simplex-chat.cabal') }}-${{ github.run_id }}
          restore-keys: |
            linux-core-store-ghc9.6.3-${{ hashFiles('chat/cabal.project', 'chat/simplex-chat.cabal') }}-
            linux-core-store-ghc9.6.3-

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp3-dev zlib1g-dev libnuma-dev libssl-dev patchelf strip-nondeterminism libfuse2 desktop-file-utils file

      - name: Prepare cabal.project.local
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          echo "ignore-project: False"    >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl"      >> cabal.project.local
          # a restored dist-newstyle can hold an older version's build directory, which breaks the script's simplex-chat-* glob
          version=$(sed -n 's/^version: *//p' simplex-chat.cabal)
          find "dist-newstyle/build/$(uname -m)-linux/ghc-9.6.3" -maxdepth 1 -name 'simplex-chat-*' ! -name "simplex-chat-$version" -exec rm -rf {} + 2> /dev/null || true

      - name: Build core library
        id: core
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          SKIP_VLC: '1'
        run: scripts/desktop/build-lib-linux.sh

      # saved even when a later step fails
      - name: Save cabal store
        if: ${{ !cancelled() && steps.core-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            chat/dist-newstyle
          key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

      - name: Save core library
        if: ${{ steps.core.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            chat/apps/multiplatform/common/src/commonMain/cpp/desktop/libs/linux-x86_64
            chat/apps/multiplatform/build/links
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Package
        env:
          SHA: ${{ inputs.sha }}
          REPO: ${{ inputs.repo }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pkg"
          mkdir -p "$out"
          libs=apps/multiplatform/common/src/commonMain/cpp/desktop/libs/linux-x86_64
          [ -s "$libs/libsimplex.so" ]
          # the libs only: VLC is fetched by ~/build, and a libcrypto copy is added when the AppImage is made
          tar --owner=0 --group=0 --numeric-owner -C "$libs" --exclude=./vlc -cf - . | zstd -19 -T0 -q -o "$out/core.tar.zst"
          {
            echo "repo=$REPO"
            echo "sha=$SHA"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "nonce=$NONCE"
            echo "run=$GITHUB_RUN_ID"
            echo "sha256.libsimplex.so=$(sha256sum < "$libs/libsimplex.so" | cut -d' ' -f1)"
            echo "sha256.core.tar.zst=$(sha256sum < "$out/core.tar.zst" | cut -d' ' -f1)"
          } > "$out/BUILD-INFO"
          cat "$out/BUILD-INFO"
          ls -la "$out"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-core-${{ inputs.nonce }}
          path: ${{ runner.temp }}/pkg
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

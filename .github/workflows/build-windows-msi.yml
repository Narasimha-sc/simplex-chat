name: build-windows-msi

on:
  workflow_dispatch:

jobs:
  build-windows-msi:
    name: "windows-latest (Desktop MSI only)"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # prepare-build gates Java setup on tag ref; pass a synthetic tag ref so Java is installed.
      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: 17
          ghc_ver: 9.6.3
          os: windows-latest
          cache_path: "C:/cabal"
          github_ref: refs/tags/vmsi-build

      - name: Configure pagefile (Windows)
        uses: simplex-chat/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Setup MSYS2
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
          pacboy: >-
            toolchain:p
            cmake:p

      # Mirrors build.yml "Build CLI": primes the cabal store and patches simplex-chat.cabal
      # (comment out unix dep) which is required before build-lib-windows.sh.
      # rm of direct-sq*/simplexmq* works around cabal being unable to delete those packages'
      # read-only git submodule pack files (blst, libbbs) on Windows.
      - name: Build CLI (prime deps, patch cabal)
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/prepare-openssl-windows.sh
          openssl_windows_style_path=$(echo `pwd`/dist-newstyle/openssl-3.0.15 | sed 's#/\([a-zA-Z]\)#\1:#' | sed 's#/#\\#g')
          rm cabal.project.local 2>/dev/null || true
          echo "ignore-project: False" >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl" >> cabal.project.local
          echo "    extra-include-dirs: $openssl_windows_style_path\include" >> cabal.project.local
          echo "    extra-lib-dirs: $openssl_windows_style_path" >> cabal.project.local

          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/simplexmq*
          sed -i "s/, unix /--, unix /" simplex-chat.cabal
          cabal build -j --enable-tests
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/simplexmq*

      - name: Build Desktop MSI
        id: windows_desktop_build
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/build-lib-windows.sh
          cd apps/multiplatform
          ./gradlew packageMsi
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/simplexmq*

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplex-desktop-windows-x86_64-msi
          path: apps/multiplatform/release/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

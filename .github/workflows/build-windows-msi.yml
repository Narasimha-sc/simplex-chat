name: build-windows-msi

# Fork-only workflow for ad-hoc MSI builds from feature branches.
# Not intended to be merged upstream.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows MSI installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: 17
          ghc_ver: 9.6.3
          os: windows-latest
          cache_path: "C:/cabal"
          github_ref: ${{ github.ref }}

      # prepare-build skips Java setup on non-tag refs, so install it here.
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 17
          cache: 'gradle'

      - name: Configure pagefile (Windows)
        uses: simplex-chat/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Setup MSYS2
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Build Desktop MSI
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          sed -i "s/, unix /--, unix /" simplex-chat.cabal
          scripts/desktop/build-lib-windows.sh
          cd apps/multiplatform
          ./gradlew -Psimplex.assets.dir=../../assets packageMsi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplex-desktop-windows-x86_64-msi
          path: apps/multiplatform/release/main/msi/*.msi
          retention-days: 14
          if-no-files-found: error
